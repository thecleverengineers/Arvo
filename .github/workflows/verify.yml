name: Verify Arvo client and API
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Check React app build
        run: npm run build
      - name: Install API
        run: npm --prefix server ci
      - name: Check API source syntax
        run: |
          find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
